  <style>
    body {
      background-color: #001f3f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    h1, h2 {
      color: #ffeb3b;
      margin: 10px 0;
    }
    
    textarea {
      width: 90%;
      height: 100px;
      background-color: #011627;
      color: #00e5ff;
      border: 2px solid #00e5ff;
      border-radius: 8px;
      padding: 10px;
      margin: 10px auto;
      font-family: monospace;
      display: block;
    }
    
    button {
      padding: 10px 20px;
      background-color: #ffeb3b;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      color: #001f3f;
      cursor: pointer;
      margin: 10px;
      font-size: 16px;
    }
    
    #acceptanceMessage {
      font-size: 24px;
      font-weight: bold;
      margin: 10px;
    }
    
    #treeContainer {
      margin-top: 20px;
      background-color: #011627;
      border-radius: 10px;
      padding: 10px;
      height: 800px;
      overflow: auto;
    }
    
    /* RECTANGLES (Nodes) */
    .node rect {
      fill: #ffeb3b;
      stroke: #00e5ff;
      stroke-width: 2px;
      rx: 10;
      ry: 10;
    }
    
    /* TEXT inside nodes */
    .node text {
      font: 14px monospace;
      fill: #000000; /* Pure black inside yellow node */
      font-weight: bold;
    }
    
    /* LINES (Links between nodes) */
    .link {
      fill: none;
      stroke: #66ccff; /* Light blue lines */
      stroke-width: 2px;
    }
    
    .mode-switch {
      margin: 10px;
    }
    
    /* Dropdown Renad Alkahtani Button */
    .dropdown {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5000;
    }
    
    .dropbtn {
      background-color: #ffeb3b;
      color: #001f3f;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px #ffeb3b;
      animation: sparkle 1.5s infinite alternate;
    }
    
    @keyframes sparkle {
      from { box-shadow: 0 0 10px #ffeb3b; }
      to { box-shadow: 0 0 20px #ffeb3b, 0 0 30px #ffeb3b; }
    }
    
    /* Dropdown Content */
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #011627;
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px #00e5ff;
      border-radius: 8px;
      z-index: 5001;
      right: 0;
    }
    
    .dropdown-content a {
      color: #66ccff; /* Light blue links */
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      font-weight: bold;
    }
    
    .dropdown-content a:hover {
      background-color: #003366;
    }
    
    .dropdown:hover .dropdown-content {
      display: block;
    }
    
    /* SIMPLE Toggle Chase Button */
    #toggleChaseButton {
      background-color: #00e5ff; /* light blue */
      color: #001f3f;             /* dark navy text */
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 14px;
      z-index: 6000;
      transition: background-color 0.3s ease;
    }
    
    #toggleChaseButton:hover {
      background-color: #66ccff; /* lighter blue on hover */
    }

// تنظيف قواعد اللغة
function cleanGrammar(text) {
  return text
    .replace(/\/\/.*$/gm, '')      // حذف التعليقات الأحادية
    .replace(/\/\*.*?\*\//gs, 'ε') // استبدال التعليقات المتعددة بـ ε
    .replace(/;/g, '')             // إزالة الفواصل المنقوطة
    .trim();
}

// تحليل قواعد اللغة إلى كائن
function parseGrammar(grammarText) {
  const rules = {};
  grammarText.split('\n').forEach(line => {
    if (line.includes(':')) {
      const [left, right] = line.split(':');
      rules[left.trim()] = right.trim().split('|').map(opt => opt.trim().split(/\s+/));
    }
  });
  return rules;
}

// تحليل السلسلة إلى رموز
function parseInput(inputText) {
  return inputText.trim().split(/\s+/);
}

// المحلل النحوي الأساسي
function tryParse(symbol, tokens, rules) {
  if (symbol === 'ε' || symbol === 'epsilon') {
    return { node: { name: 'ε', children: [] }, tokens };
  }

  if (!(symbol in rules)) {
    if (tokens.length > 0 && tokens[0] === symbol) {
      return {
        node: { name: `${symbol} (${tokens[0]})`, children: [] },
        tokens: tokens.slice(1)
      };
    } else {
      return null;
    }
  }

  for (const option of rules[symbol]) {
    let tempTokens = [...tokens];
    let children = [];
    let matched = true;

    for (const part of option) {
      const result = tryParse(part, tempTokens, rules);
      if (result) {
        children.push(result.node);
        tempTokens = result.tokens;
      } else {
        matched = false;
        break;
      }
    }

    if (matched) {
      return {
        node: { name: symbol, children },
        tokens: tempTokens
      };
    }
  }

  return null;
}

// بناء شجرة من الرموز فقط (عند الرفض)
function buildTokenTree(tokens) {
  return {
    name: "Tokens",
    children: tokens.map(token => ({ name: token, children: [] }))
  };
}

// بناء شجرة القواعد في وضع "grammar"
function buildGrammarTree(rules) {
  function buildNode(symbol, visited = new Set()) {
    if (visited.has(symbol)) return { name: symbol, children: [] };
    visited.add(symbol);
    if (!rules[symbol]) return { name: symbol, children: [] };
    return {
      name: symbol,
      children: rules[symbol].map(opt => ({
        name: '|',
        children: opt.map(part => buildNode(part, new Set(visited)))
      }))
    };
  }
  const startSymbol = Object.keys(rules)[0];
  return buildNode(startSymbol);
}

// رسم الشجرة باستخدام D3.js
function drawTree(treeData) {
  document.getElementById('treeContainer').innerHTML = '';
  const svg = d3.select('#treeContainer').append('svg')
    .attr('width', 2000)
    .attr('height', 1000)
    .call(d3.zoom().on('zoom', (event) => {
      svg.attr('transform', event.transform);
    }))
    .append('g')
    .attr('transform', 'translate(1000,50)');

  const treeLayout = d3.tree().nodeSize([120, 200]);
  const root = d3.hierarchy(treeData);
  treeLayout(root);

  svg.selectAll('.link')
    .data(root.links())
    .join('path')
    .attr('class', 'link')
    .attr('d', d3.linkVertical().x(d => d.x).y(d => d.y));

  const node = svg.selectAll('.node')
    .data(root.descendants())
    .join('g')
    .attr('class', 'node')
    .attr('transform', d => `translate(${d.x},${d.y})`);

  node.append('rect')
    .attr('width', 100)
    .attr('height', 24)
    .attr('x', -50)
    .attr('y', -12)
    .attr('rx', 8)
    .attr('ry', 8);

  node.append('text')
    .attr('dy', 4)
    .attr('text-anchor', 'middle')
    .text(d => d.data.name);
}

// الدالة الرئيسية للتنفيذ
function generateTree() {
  const grammarRaw = document.getElementById('grammar').value.trim();
  const grammarText = cleanGrammar(grammarRaw);
  const inputText = document.getElementById('testString').value.trim();
  const mode = document.querySelector('input[name="mode"]:checked').value;

  if (!grammarText) {
    alert('Please provide grammar rules.');
    return;
  }

  const rules = parseGrammar(grammarText);
  document.getElementById('acceptanceMessage').innerText = '';

  if (mode === 'grammar') {
    const grammarTree = buildGrammarTree(rules);
    drawTree(grammarTree);
    document.getElementById('acceptanceMessage').innerHTML = '<span style="color:lightgreen;">(Grammar Mode)</span>';
  } else {
    if (!inputText) {
      alert('Please provide a test string.');
      return;
    }

    const tokens = parseInput(inputText);
    const startSymbol = Object.keys(rules)[0];
    const result = tryParse(startSymbol, tokens, rules);

    if (result && result.tokens.length === 0) {
      drawTree(result.node);
      document.getElementById('acceptanceMessage').innerHTML = '<span style="color:lightgreen;">ACCEPTED ✅</span>';
    } else {
      drawTree(buildTokenTree(tokens));
      document.getElementById('acceptanceMessage').innerHTML = '<span style="color:red;">NOT ACCEPTED ❌</span>';
    }
  }
}
